name: CI

# The repo had tests but nothing ran them on push.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor (3.9 is EOL; 3.10 is weeks from EOL).
        # 3.14 is current CPython.
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The repo declares its own test deps, including pytest-asyncio, which
      # asyncio_mode = "auto" and the async tests both need. Installing a bare
      # pytest instead silently turns those into failures.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Import on the declared floor
        run: python -c "import surface; print(surface.__name__, 'imports')"

      - name: Test
        run: pytest -q

      # A suite that collects nothing must not report success.
      - name: Tests must have run
        run: |
          count=$(pytest --collect-only -q 2>/dev/null | grep -cE '::') || true
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::no tests were collected"
            exit 1
          fi
          echo "collected $count test(s)"
