[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tendrl-surface"
version = "0.1.0"
description = "Python SDK for the Surface file scanning API"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["surface", "tests"]
venvPath = "."
venv = ".venv"

[tool.hatch.build.targets.wheel]
# Hatchling infers the package directory from the project name. The name is
# tendrl-surface and the directory is surface/, so the inference no longer
# lands and has to be stated. Without this, metadata generation fails outright
# and `pip install git+...` cannot build the package at all.
packages = ["surface"]
